# Logical task names -> lmms-eval task names.
# Check your local lmms-eval installation and edit these names if needed.
tasks:
  textvqa:
    ability: OCR
    lmms_eval_name: textvqa
    metric: exact_match
  chartqa:
    ability: chart_reasoning
    lmms_eval_name: chartqa
